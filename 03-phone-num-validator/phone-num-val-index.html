<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Number Validator</title>
  <link rel="stylesheet" href="phone-num-val-styles.css" />
</head>
<body>
  <header>
    <h1>Phone Number Validator</h1>
  </header>
  <main>
    <p>Enter a phone number to check if it is a valid US number. US phone numbers have ten digits, including the area code, plus an optional country code.</p>
    <input id="user-input" type="text">
    <button id="check-btn">Check</button>
    <button id="clear-btn">Clear</button>
    <div id="results-div"></div>
  </main>
  <script src="phone-num-val-scripts.js"></script>
</body>
</html>
